<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Egg Phases — Interaction Lab v9</title>
<meta name="description" content="One phase of the egg process per full page. Swipe up for the next phase; inside each page the same step grows from one egg to many.">
<link rel="stylesheet" href="phases.css">
</head>
<body>
<div id="app">
  <header class="hdr">
    <div><b>EGG PHASES</b><span class="sub"> / one step, every scale</span></div>
    <div class="r"><span class="keys">↑↓ phase · A auto</span><span id="cnt" class="cnt">01 / 07</span></div>
  </header>

  <main class="stagewrap">
    <div id="pages" class="pages" tabindex="0" aria-label="Seven phases of the egg process, one per page. Swipe or scroll up for the next phase."></div>
    <ol id="rail" class="rail" aria-hidden="true"></ol>
  </main>

  <nav class="bar" aria-label="Controls">
    <div class="grp" role="group" aria-label="Phase">
      <button type="button" id="b-up" aria-label="Previous phase"><svg viewBox="0 0 16 16"><path d="m2 10 6-6 6 6"/></svg></button>
      <button type="button" id="b-down" aria-label="Next phase"><svg viewBox="0 0 16 16"><path d="m2 6 6 6 6-6"/></svg></button>
    </div>
    <span id="ph" class="ph" aria-hidden="true">COLD STORE</span>
    <button type="button" id="b-auto" class="auto" aria-pressed="false">AUTO</button>
  </nav>
</div>
<p id="live" class="sr" role="status" aria-live="polite"></p>
<script src="phases.js"></script>
</body>
</html>
